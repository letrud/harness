name: Rebuild from intent

# Reusable workflow for a repo whose intent/ is the specification and whose
# implementation is written from it. The caller is content-agnostic and can be
# copied between repositories verbatim:
#
#   on:
#     push:
#       branches: [main]
#       paths: ["intent/**"]
#     workflow_dispatch:
#       inputs:
#         before: { type: string, default: "" }   # set by the push hand-off
#         after:  { type: string, default: "" }   # empty = full reconcile
#   permissions:
#     contents: write
#     pull-requests: write
#     id-token: write
#     actions: write
#   jobs:
#     rebuild:
#       uses: letrud/harness/.github/workflows/rebuild-from-intent.yml@v1
#       with:
#         before: ${{ inputs.before }}
#         after: ${{ inputs.after }}
#       secrets: inherit
#
# Everything the agent needs to know — language, layout, distribution, how the
# implementation proves itself — is read from the Markdown under intent/. Where
# the intent is silent the agent decides and records the decision in the PR.
#
# What it does, in order:
#   0. a push cannot run the agent (claude-code-action accepts dispatch, schedule and
#      PR/issue events, not push), so a push hands off: it re-dispatches the caller's
#      own workflow with the push's before/after commits and stops
#   1. works out what changed under intent/ (before..after, or "everything")
#   2. resumes an unfinished branch, if one exists
#   3. runs the caller's check, if one is given
#   4. dispatches Claude Code to bring the implementation into line with the intent
#      and open a pull request — never merging
#
# Without a credential (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY) it records
# the intent change and stops. Nothing here edits intent/: the intent is the
# contract, and code is downstream of it.

on:
  workflow_call:
    inputs:
      before:
        description: "Commit before the intent change. Set by the push hand-off; empty = full reconcile."
        required: false
        default: ""
        type: string
      after:
        description: "Commit after the intent change. Set by the push hand-off."
        required: false
        default: ""
        type: string
      intent_dir:
        description: "Directory holding the specification."
        required: false
        default: "intent"
        type: string
      check:
        description: "Optional shell command that proves the implementation satisfies the intent. Its outcome is shown to Claude. Usually unnecessary: the intent states how the implementation proves itself."
        required: false
        default: ""
        type: string
      instructions:
        description: "Optional extra instructions appended to the brief. Prefer stating such things in the intent itself."
        required: false
        default: ""
        type: string
      claude_args:
        description: "Extra args for the Claude CLI (model, turn limit)."
        required: false
        default: "--max-turns 500"
        type: string
      branch_prefix:
        description: "Prefix for the branch Claude works on."
        required: false
        default: "rebuild/"
        type: string
      autofix:
        description: "Dispatch Claude. false = record the change only."
        required: false
        default: true
        type: boolean
    secrets:
      anthropic_api_key:
        description: "Anthropic API key. Either this or claude_code_oauth_token enables the rebuild."
        required: false
      claude_code_oauth_token:
        description: "Claude Code OAuth token from `claude setup-token` (Pro/Max subscription)."
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  # A push re-dispatches the caller's own workflow, carrying the push range.
  handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch as workflow_dispatch with the push range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          file="${WORKFLOW_REF#*/.github/workflows/}"; file="${file%@*}"
          echo "push to $REF changed the intent; dispatching $file with $BEFORE..$AFTER"
          gh workflow run "$file" --repo "$GITHUB_REPOSITORY" --ref "$REF" -f before="$BEFORE" -f after="$AFTER"

  rebuild:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What changed under the intent
        id: change
        env:
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after || github.sha }}
          INTENT: ${{ inputs.intent_dir }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && git cat-file -e "$AFTER" 2>/dev/null; then
            echo "kind=diff" >> "$GITHUB_OUTPUT"
            git diff --stat "$BEFORE" "$AFTER" -- "$INTENT" > intent-change.stat
            git diff "$BEFORE" "$AFTER" -- "$INTENT" > intent-change.diff
          else
            echo "kind=full" >> "$GITHUB_OUTPUT"
            : > intent-change.stat
            : > intent-change.diff
          fi
          echo "changed under $INTENT/:"
          cat intent-change.stat

      # A session cut short (turn budget, timeout) leaves its work on a branch.
      # If such a branch exists with no pull request, continue from it rather
      # than starting over from the default branch.
      - name: Resume unfinished work
        id: resume
        env:
          PREFIX: ${{ inputs.branch_prefix }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          branch=""
          for b in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' "refs/remotes/origin/${PREFIX}*"); do
            short="${b#origin/}"
            open=$(gh pr list --head "$short" --state open --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$open" = "0" ] && [ "$(git rev-list --count "origin/$BASE..$b")" -gt 0 ]; then branch="$short"; break; fi
          done
          if [ -n "$branch" ]; then
            git checkout -q -B "$branch" "origin/$branch"
            ahead=$(git rev-list --count "origin/$BASE..HEAD")
            git log --format='%h %s' "origin/$BASE..HEAD" > resume.log
            { echo "branch=$branch"; echo "ahead=$ahead"; } >> "$GITHUB_OUTPUT"
            echo "resuming $branch: $ahead commits ahead of $BASE, no pull request yet"
            cat resume.log
          else
            echo "branch=" >> "$GITHUB_OUTPUT"; echo "ahead=0" >> "$GITHUB_OUTPUT"
            echo "no unfinished work under ${PREFIX}*"
          fi

      - name: Does the implementation still hold
        id: check
        if: inputs.check != ''
        continue-on-error: true
        env:
          CHECK: ${{ inputs.check }}
        run: |
          set -o pipefail
          bash -c "$CHECK" 2>&1 | tee check.txt

      - name: Is a Claude credential available
        id: cred
        env:
          API_KEY: ${{ secrets.anthropic_api_key }}
          OAUTH: ${{ secrets.claude_code_oauth_token }}
        run: |
          if [ -n "$API_KEY" ] || [ -n "$OAUTH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN — the intent change is recorded, nothing is rebuilt"
          fi

      # The prompt is assembled here rather than inline so that optional sections
      # (the diff, the check, the caller's instructions) appear only when they exist.
      - name: Compose the brief
        id: brief
        if: ${{ inputs.autofix && steps.cred.outputs.present == 'true' }}
        env:
          INTENT: ${{ inputs.intent_dir }}
          KIND: ${{ steps.change.outputs.kind }}
          CHECK: ${{ inputs.check }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          INSTRUCTIONS: ${{ inputs.instructions }}
          PREFIX: ${{ inputs.branch_prefix }}
          RESUME: ${{ steps.resume.outputs.branch }}
          AHEAD: ${{ steps.resume.outputs.ahead }}
        run: |
          {
            cat <<EOF
          The specification of this repository lives under \`$INTENT/\` and it has changed.
          The implementation is written from it. Bring the implementation back into line
          with the intent — or, if there is no implementation yet, build it.

          ## Ground rules

          - \`$INTENT/\` is the source of truth. Read every Markdown file at its top level in
            full before writing anything, then the rest of the directory. Where code and intent
            disagree, the code is wrong.
          - Never edit \`$INTENT/\`. If the intent declares files under it as generated by the
            implementation, it also says who writes them and when — obey that exactly; if it
            does not say, leave them. Never edit the intent to make a check pass. Something you
            learn that belongs in the intent is proposed as its own change and named in yours.
          - Unknown is unknown. Do not infer a value, a host, a path or a behaviour the intent
            does not state or that you have not confirmed by running it.
          - Every MUST in the intent is a requirement; every MUST NOT is a test you should be
            able to point at. Where the intent is silent, decide like a careful engineer and
            record the decision in the pull request, not in the intent.
          - Honesty over completeness. What could not be verified is said so, in the code's
            own reporting and in the pull request.
          - The intent may state the language, the layout, the distribution form and how the
            implementation proves itself. Where it does, obey it. Where it is silent, choose
            what a careful engineer would and record the choice in the pull request. Do not
            write the choice into the intent.

          ## Conventions every repository built this way shares

          - The workflow that proves the implementation on every push and pull request is
            \`.github/workflows/build.yml\`. Releases, if the intent calls for shipped
            artefacts, are \`.github/workflows/release.yml\` on a \`v*\` tag. Other systems
            read stage state from these two names.
          - A change is to the intent or to the implementation, never both. \`build.yml\` MUST
            refuse a pull request that modifies \`$INTENT/\` together with anything outside it.
            Your pull request modifies nothing under \`$INTENT/\` — the automation on the default
            branch writes whatever the intent declares as generated (evidence, generated docs)
            after your change is accepted. Run the proofs, state their result per instance and
            per operation in the pull request, and discard the files they regenerate.
          - Do not modify the workflow that dispatched you.
          - The runner already has Go, Node, Python, Java, .NET and Rust. Install anything
            else you need in the job, and in \`build.yml\`.
          - The secrets this repository's own CI uses are in your environment under the same
            names. Run the proofs the intent prescribes against real test environments before
            you commit, exactly as CI would. Never print a secret, never write one to the tree.

          ## What changed

          EOF
            if [ "$KIND" = "diff" ]; then
              echo "The intent changed in this push. The statistics and the full diff are in"
              echo "\`intent-change.stat\` and \`intent-change.diff\` in the workspace — read the diff"
              echo "before anything else; it is the reason you are here."
            else
              echo "This is a full reconcile: treat the whole intent as newly stated and make the"
              echo "implementation satisfy all of it."
            fi
            if [ -n "$RESUME" ]; then
              echo
              echo "## Unfinished work — continue, do not start over"
              echo
              echo "A previous session was cut short. Its work is on the branch \`$RESUME\`, $AHEAD commits"
              echo "ahead of the default branch, with no pull request yet. You are checked out on it."
              echo "Read its log and its code first; then finish what it began — do not recreate what"
              echo "already exists, and do not start a new branch. Commit and push to \`$RESUME\`."
              echo
              echo "Its commits, newest first:"
              echo
              echo '```'; cat resume.log; echo '```'
            fi
            if [ -n "$CHECK" ]; then
              echo
              echo "## Does the implementation currently hold"
              echo
              echo "The caller's check \`$CHECK\` finished with outcome **$CHECK_OUTCOME**. Its output"
              echo "is in \`check.txt\` in the workspace."
            fi
            cat <<EOF

          ## What to produce

          1. The implementation change, or the implementation.
          2. Tests that pin the intent's requirements — in particular anything it states as
             MUST NOT.
          3. Continuous integration that proves the implementation against the intent on every
             push and pull request. If such a workflow exists, keep it true; if it does not, add
             it. The repo-specific instructions below may name the files it must use.
          4. Documentation only where it describes how to build and where the implementation
             lives; keep the repository's voice.

          EOF
            if [ -n "$CHECK" ]; then echo "Run \`$CHECK\` until it passes."; else echo "Run whatever proves the implementation before you finish."; fi
            if [ -n "$INSTRUCTIONS" ]; then
              echo
              echo "## Repo-specific instructions"
              echo
              printf '%s\n' "$INSTRUCTIONS"
            fi
            cat <<EOF

          ## Delivering

          Unless you are continuing on an existing branch, create one prefixed \`$PREFIX\` and
          push it before you write code. Commit and push as you go — after each coherent step,
          not only at the end — so that nothing is lost if this session is cut short. Your turn
          budget is finite: leave the CI workflow and the pull request for no later than the
          last quarter of your work, and if you must choose, a pull request describing what is
          unfinished beats unfinished work with no pull request. Open it against the default
          branch with \`gh pr create\`. The description states, in plain language: what
          the intent required (and what changed, if this was a change), how the implementation
          satisfies each part of it, what you decided where the intent was silent, and what you
          could not verify. Do not merge.
          EOF
          } > brief.md
          echo "brief: $(wc -l < brief.md) lines"
          { echo "text<<BRIEF_EOF"; cat brief.md; echo "BRIEF_EOF"; } >> "$GITHUB_OUTPUT"

      # The implementation proves itself the way its own CI does, and that can need
      # secrets — a bank's test credentials, a registry token. The agent gets exactly
      # the secrets the repository's own workflows reference (`secrets.NAME` under
      # .github/workflows/), never the Claude credentials or the job token, and never
      # anything the repo's CI does not itself use. Values are masked in the log.
      - name: Give the agent the secrets its CI uses
        if: ${{ inputs.autofix && steps.cred.outputs.present == 'true' }}
        env:
          INHERITED: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, re, glob
          never = {"GITHUB_TOKEN", "ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN",
                   "github_token", "anthropic_api_key", "claude_code_oauth_token"}
          referenced = set()
          for f in glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"):
              referenced |= set(re.findall(r"secrets\.([A-Za-z_][A-Za-z0-9_]*)", open(f, encoding="utf-8").read()))
          inherited = json.loads(os.environ["INHERITED"])
          given = []
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for name in sorted(referenced - never):
                  value = inherited.get(name)
                  if not value: continue
                  print(f"::add-mask::{value}")
                  env.write(f"{name}<<__EOF_{name}__" + chr(10) + value + chr(10) + f"__EOF_{name}__" + chr(10))
                  given.append(name)
          print("secrets referenced by this repository's CI and given to the agent:", ", ".join(given) or "none")
          PY

      # Bash is unrestricted: the agent must run whatever toolchain the intent names,
      # and the runner is ephemeral. The credential it could read is the one it is using.
      #
      # The full transcript contains every file the agent read. On a private repo it
      # is kept (log + artifact) because it is the only account of a failed run; on a
      # public repo only the digest is kept, so nothing the agent read becomes public.
      - name: Bring the implementation into line with the intent
        id: claude
        if: ${{ inputs.autofix && steps.cred.outputs.present == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: ${{ github.event.repository.private == true }}
          allowed_bots: github-actions      # the push hand-off dispatches as this bot
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: ${{ inputs.branch_prefix }}
          prompt: ${{ steps.brief.outputs.text }}
          claude_args: |
            ${{ inputs.claude_args }}
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,MultiEdit"

      # The transcript is the only account of what the agent did and why it
      # stopped. Keep it: GitHub masks registered secrets in logs and artifacts.
      - name: Keep the transcript
        if: ${{ always() && steps.claude.outputs.execution_file != '' && github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Transcript digest
        id: digest
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        env:
          FILE: ${{ steps.claude.outputs.execution_file }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          python3 - <<'PY' > digest.md || echo "_could not parse the transcript_" > digest.md
          import json, os
          msgs = json.load(open(os.environ["FILE"]))
          if isinstance(msgs, dict): msgs = [msgs]
          result = next((m for m in reversed(msgs) if m.get("type") == "result"), {})
          texts = []
          for m in msgs:
              if m.get("type") != "assistant": continue
              for b in (m.get("message") or {}).get("content") or []:
                  if isinstance(b, dict) and b.get("type") == "text" and b.get("text", "").strip():
                      texts.append(b["text"].strip())
          tools = {}
          for m in msgs:
              if m.get("type") != "assistant": continue
              for b in (m.get("message") or {}).get("content") or []:
                  if isinstance(b, dict) and b.get("type") == "tool_use":
                      tools[b.get("name")] = tools.get(b.get("name"), 0) + 1
          print("### Agent transcript")
          print()
          print(f"- result: `{result.get('subtype')}`" + (" — **is_error**" if result.get("is_error") else ""))
          print(f"- turns: {result.get('num_turns')} · duration: {round((result.get('duration_ms') or 0)/60000, 1)} min · cost: ${round(result.get('total_cost_usd') or 0, 2)}")
          if tools: print("- tools: " + ", ".join(f"{k} ×{v}" for k, v in sorted(tools.items(), key=lambda kv: -kv[1])))
          err = result.get("result") if result.get("is_error") else None
          if err:
              print(); print("**Error result**"); print(); print("```"); print(str(err)[:3000]); print("```")
          if texts:
              print(); print("**Last thing the agent said**"); print(); print(texts[-1][:4000])
          private = os.environ.get("PRIVATE") == "true"
          print(); print("Full transcript: the `claude-transcript` artifact on this run." if private else "Full transcript not kept: this repository is public.")
          PY
          cat digest.md

      - name: Summary
        if: always()
        env:
          KIND: ${{ steps.change.outputs.kind }}
          CHECK: ${{ inputs.check }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PRESENT: ${{ steps.cred.outputs.present }}
          RESUME: ${{ steps.resume.outputs.branch }}
          DISPATCHED: ${{ inputs.autofix && steps.cred.outputs.present == 'true' }}
        run: |
          {
            echo "## Intent change — ${{ github.repository }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| change | $KIND |"
            echo "| resumed | ${RESUME:-no} |"
            echo "| check | ${CHECK:+$CHECK_OUTCOME}${CHECK:-none configured} |"
            echo "| credential | $PRESENT |"
            if [ "$DISPATCHED" = "true" ]; then echo "| rebuild | dispatched — see the pull request |"; else echo "| rebuild | not dispatched |"; fi
            echo
            if [ -s intent-change.stat ]; then echo '```'; cat intent-change.stat; echo '```'; fi
            echo
            if [ -f digest.md ]; then cat digest.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
